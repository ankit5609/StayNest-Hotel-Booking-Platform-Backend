# Multipart Config
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:10MB}

# Cloudinary Config
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Cancellation Policy Configuration
cancellation.full-refund-days=${CANCELLATION_FULL_REFUND_DAYS:7}
cancellation.partial-refund-days=${CANCELLATION_PARTIAL_REFUND_DAYS:3}
cancellation.partial-refund-percent=${CANCELLATION_PARTIAL_REFUND_PERCENT:50}

# Spring AI - OpenRouter (OpenAI-compatible adapter)
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://openrouter.ai/api}
spring.ai.openai.api-key=${OPENROUTER_API_KEY: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}
spring.ai.openai.chat.options.model=${AI_PRICING_MODEL:openai/gpt-oss-20b}

# Pricing Rule Configuration (previously hardcoded inside strategy classes)
pricing.rules.occupancy-threshold=${PRICING_RULES_OCCUPANCY_THRESHOLD:0.8}
pricing.rules.occupancy-multiplier=${PRICING_RULES_OCCUPANCY_MULTIPLIER:1.2}
pricing.rules.urgency-window-days=${PRICING_RULES_URGENCY_WINDOW_DAYS:7}
pricing.rules.urgency-multiplier=${PRICING_RULES_URGENCY_MULTIPLIER:1.15}
pricing.rules.holiday-multiplier=${PRICING_RULES_HOLIDAY_MULTIPLIER:1.25}
pricing.rules.holiday-dates=${PRICING_RULES_HOLIDAY_DATES:2026-01-01,2026-08-15,2026-10-02,2026-12-25}

# AI Dynamic Pricing Configuration
pricing.ai.enabled=${AI_PRICING_ENABLED:false}
pricing.ai.min-multiplier=${PRICING_AI_MIN_MULTIPLIER:0.80}
pricing.ai.max-multiplier=${PRICING_AI_MAX_MULTIPLIER:1.30}
pricing.ai.velocity-lookback-days=${PRICING_AI_VELOCITY_LOOKBACK_DAYS:7}

# --- Embeddings: OpenAI direct (OpenRouter has no embedding endpoint) ---
spring.ai.openai.embedding.base-url=${SPRING_AI_OPENAI_EMBEDDING_BASE_URL:https://api.openai.com}
spring.ai.openai.embedding.api-key=${OPENAI_API_KEY:dummy-key}
spring.ai.openai.embedding.options.model=${SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL:text-embedding-3-small}

# --- pgvector store ---
spring.ai.vectorstore.pgvector.index-type=${SPRING_AI_VECTORSTORE_PGVECTOR_INDEX_TYPE:HNSW}
spring.ai.vectorstore.pgvector.distance-type=${SPRING_AI_VECTORSTORE_PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
spring.ai.vectorstore.pgvector.dimensions=${SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS:1536}
spring.ai.vectorstore.pgvector.initialize-schema=${SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:true}

# --- Review Q&A feature flag ---
review.qa.enabled=${REVIEW_QA_ENABLED:false}
review.qa.top-k=${REVIEW_QA_TOP_K:5}
review.qa.similarity-threshold=${REVIEW_QA_SIMILARITY_THRESHOLD:0.5}

# --- Conversational Search (Natural Language Search) ---
search.nl.enabled=${NL_SEARCH_ENABLED:true}