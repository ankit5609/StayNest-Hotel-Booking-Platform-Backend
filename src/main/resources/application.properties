stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_2dc50df58bbd417b008671285da17a36296c432a02f1eec3e664ec2333dcbb70}
booking.expiry.minutes=${BOOKING_EXPIRY_MINUTES:10}
